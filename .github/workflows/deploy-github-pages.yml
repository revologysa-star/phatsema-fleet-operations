name: Validate Phatsema static package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend package
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f app.js
          test -f styles.css
          grep -q 'src="./app.js"' index.html
          grep -q 'href="./styles.css"' index.html
          grep -q 'select option' styles.css
          grep -q 'function addMachine' app.js
          grep -q 'function addBreakdown' app.js
          grep -q 'function addService' app.js
          grep -q 'function status' app.js
          grep -q 'function repair' app.js
          grep -q 'function load' app.js
          echo "Phatsema frontend package validation passed"
