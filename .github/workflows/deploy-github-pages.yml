name: Validate Phatsema static package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify public-only release
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-static.sh
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/icons/icon-192.png
          test -s dist/icons/icon-512.png
          test -s dist/sw.js
          test ! -e dist/supabase
          test ! -e dist/.env
          grep -q 'data-pwa-install' dist/index.html
