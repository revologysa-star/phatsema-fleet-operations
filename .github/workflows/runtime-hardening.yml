name: Phatsema runtime hardening
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime architecture
        shell: bash
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          grep -q 'supabase.createClient' app.js
          grep -q 'onAuthStateChange' app.js
          grep -q 'signInWithPassword' app.js
          grep -q 'from("machines")' app.js
          grep -q 'from("breakdowns")' app.js
          grep -q 'from("services")' app.js
          grep -q 'from("profiles")' app.js
          grep -q 'from("app_settings")' app.js
          echo "Runtime architecture checks passed."