name: Publish Phatsema Fleet App

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fleet dashboard fix and use Vercel static deployment
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          if not index.exists():
              raise SystemExit('index.html not found')
          s = index.read_text(encoding='utf-8')

          marker = 'PHATSEMA DASHBOARD FIX 2026-09-16'
          if marker not in s:
              patch = r'''<script>
              /* PHATSEMA DASHBOARD FIX 2026-09-16 */
              (function(){
                function fleetDashboardFixed(){
                  try{
                    const active=(machines||[]).filter(m=>m.active!==false);
                    const activeIds=new Set(active.map(m=>m.id));
                    const openMachineIds=new Set((breakdowns||[])
                      .filter(b=>!b.resolved_at && b.machine_id && activeIds.has(b.machine_id))
                      .map(b=>b.machine_id));
                    const brokenIds=new Set(active.filter(m=>String(m.status||'').toLowerCase()==='breakdown').map(m=>m.id));
                    openMachineIds.forEach(id=>brokenIds.add(id));
                    const counts={working:0,available:0,breakdown:0,maintenance:0,offline:0};
                    active.forEach(m=>{
                      const status=brokenIds.has(m.id)?'breakdown':String(m.status||'offline').toLowerCase();
                      counts[status]=(counts[status]||0)+1;
                    });
                    const broken=brokenIds.size;
                    const wp=active.length?Math.round(counts.working/active.length*1000)/10:0;
                    const op=active.length?Math.round((counts.working+counts.available)/active.length*1000)/10:0;
                    const set=(id,value)=>{const e=document.getElementById(id);if(e)e.textContent=value;};
                    set('wp',wp+'%'); set('wc',counts.working+' working'); set('op',op+'%'); set('bc',broken); set('fc',active.length);
                    const attention=document.getElementById('attention');
                    if(attention){
                      const latest=new Map();
                      (breakdowns||[]).filter(b=>!b.resolved_at&&b.machine_id&&activeIds.has(b.machine_id)).forEach(b=>{if(!latest.has(b.machine_id))latest.set(b.machine_id,b);});
                      const rows=[...latest.values()].slice(0,8);
                      attention.innerHTML=rows.length?rows.map(b=>{
                        const name=b.machines?.name||active.find(m=>m.id===b.machine_id)?.name||'Machine';
                        const reason=b.reason||'Breakdown';
                        return '<div class="notice" style="margin:6px 0"><b>'+esc(name)+'</b> — '+esc(reason)+'</div>';
                      }).join(''):'<div class="muted">No active breakdowns.</div>';
                    }
                  }catch(e){console.warn('Dashboard refresh failed',e);}
                }
                window.renderDashboard=fleetDashboardFixed;
                setTimeout(fleetDashboardFixed,1500);
                setInterval(fleetDashboardFixed,30000);
              })();
              </script>'''
              s = s.replace('</body>', patch + '\n</body>')
              index.write_text(s, encoding='utf-8')

          # Serve index.html directly from Vercel instead of routing every request
          # through the Supabase Edge Function that was returning non-2xx responses.
          Path('vercel.json').write_text('{}\n', encoding='utf-8')

      - name: Commit published app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vercel.json
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Publish corrected fleet dashboard online"
          git push
