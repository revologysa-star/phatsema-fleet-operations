name: Publish Phatsema Fleet App

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static app
        shell: bash
        run: |
          test -f index.html
          test -f vercel.json
          grep -q 'id="workingPct"' index.html
          grep -q 'id="workingCount"' index.html
          grep -q 'id="operationalPct"' index.html
          grep -q 'id="breakdownCount"' index.html
          grep -q 'id="fleetCount"' index.html
          grep -q 'https://fduccizawxtqnqtuxmjl.supabase.co' index.html
          echo 'Phatsema static app validation passed.'