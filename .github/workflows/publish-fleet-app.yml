name: Publish Phatsema Fleet App

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate clean static app
        shell: bash
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f vercel.json
          grep -q 'type="module" src="./app.js"' index.html
          grep -q 'supabase.createClient' app.js
          grep -q 'https://fduccizawxtqnqtuxmjl.supabase.co' app.js
          echo 'Phatsema clean static app validation passed.'