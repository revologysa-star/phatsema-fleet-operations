name: Validate Phatsema UI and permissions
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate application and PWA
        run: |
          node --check app.js
          node --check sw.js
          node --check pwa-install.js
          node --test tests/*.test.cjs
          grep -q 'id="loginForm"' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'report_breakdown' app.js
          grep -q 'complete_breakdown' app.js
