name: Phatsema options and tests
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate clean application
        shell: bash
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          grep -q 'type="module" src="./app.js"' index.html
          grep -q 'id="loginForm"' index.html
          grep -q 'id="addM"' app.js
          grep -q 'id="addB"' app.js
          grep -q 'id="addS"' app.js
          grep -q 'complete_breakdown' app.js
          grep -q 'create_machine' app.js
          grep -q 'report_breakdown' app.js
          grep -q 'log_service' app.js
          grep -q 'set_machine_status' app.js
          grep -q 'retire_machine' app.js
          grep -q 'id="workingPct"' app.js || true
          ! grep -q 'PHATSEMA OPTIONS V1' index.html
          ! grep -q 'PHATSEMA SESSION SYNC V1' index.html
          echo "Clean application checks passed."