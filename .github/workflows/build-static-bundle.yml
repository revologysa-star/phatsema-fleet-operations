name: Downloadable Phatsema Static App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verified app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run app and installation checks
        run: |
          node --check app.js
          node --check sw.js
          node --check pwa-install.js
          node --test tests/*.test.cjs
      - name: Build public-only static app
        run: bash scripts/build-static.sh
      - name: Save downloadable app ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phatsema-installable-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 30
