name: Clean Phatsema Dashboard Fix

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  clean-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace all layered dashboard patches with one clean patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          markers = [
              '/* PHATSEMA DASHBOARD FIX 2026-09-16 */',
              '/* PHATSEMA DASHBOARD FIX 2026-09-16-V5 */',
              '/* PHATSEMA DASHBOARD FINAL FIX */'
          ]
          positions = [s.find(m) for m in markers if s.find(m) >= 0]
          if not positions:
              print('No layered dashboard patch marker found; leaving file unchanged')
              raise SystemExit(0)
          cut = min(positions)
          prefix = s[:cut]
          if '<script>' in prefix:
              prefix = prefix.rstrip()
          clean = r'''<script>
          /* PHATSEMA DASHBOARD SINGLE SOURCE OF TRUTH */
          (function(){
            function activeMachines(){ return (window.machines || []).filter(m => m.active !== false); }
            function renderFleetDashboard(){
              const active = activeMachines();
              const ids = new Set(active.map(m => m.id));
              const open = (window.breakdowns || []).filter(b => !b.resolved_at && ids.has(b.machine_id));
              const broken = new Set(active.filter(m => String(m.status || '').toLowerCase() === 'breakdown').map(m => m.id));
              open.forEach(b => broken.add(b.machine_id));
              let working = 0, available = 0;
              active.forEach(m => {
                const st = String(m.status || '').toLowerCase();
                if (st === 'working' && !broken.has(m.id)) working++;
                if (st === 'available' && !broken.has(m.id)) available++;
              });
              const total = active.length;
              const set = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
              set('workingPct', (total ? working / total * 100 : 0).toFixed(1) + '%');
              set('workingCount', working + ' working of ' + total);
              set('operationalPct', (total ? (working + available) / total * 100 : 0).toFixed(1) + '%');
              set('breakdownCount', broken.size);
              set('fleetCount', total);
              const attention = document.getElementById('attention');
              if (attention) {
                attention.innerHTML = open.length ? open.slice(0,10).map(b => {
                  const m = active.find(x => x.id === b.machine_id);
                  return '<div class="notice"><b>' + esc(m?.name || 'Machine') + '</b> — ' + esc(b.reason || 'Breakdown') + ' <span>' + date(b.started_at) + '</span></div>';
                }).join('') : 'No active breakdowns.';
              }
            }
            async function loadFleetSingle(){
              try {
                const m = await db.from('machines').select('*').eq('active', true).order('name');
                if (m.error) { notify(m.error.message || 'Unable to load machines', true); return false; }
                window.machines = m.data || [];
                const b = await db.from('breakdowns').select('*').order('started_at', {ascending:false});
                window.breakdowns = b.error ? [] : (b.data || []);
                renderFleetDashboard();
                if (typeof renderMachines === 'function') renderMachines();
                if (typeof renderBreakdowns === 'function') renderBreakdowns();
                return true;
              } catch (e) {
                notify(e?.message || 'Unable to load fleet data', true);
                return false;
              }
            }
            async function completeRepairSingle(id){
              const ready = window.confirm('Repair complete. Is the machine ready to go back to work?');
              let reason = null;
              if (!ready) {
                reason = window.prompt('The machine will remain on breakdown. Please enter the reason it is not ready:', '');
                if (reason === null) return;
                reason = reason.trim();
                if (!reason) { notify('A reason is required when the machine is not ready.', true); return; }
              }
              const r = await db.rpc('complete_breakdown', {p_breakdown_id:id, p_ready:ready, p_reason:reason, p_notes:null});
              if (r.error) { notify(r.error.message || 'Unable to complete repair', true); return; }
              await loadFleetSingle();
              notify(ready ? 'Machine returned to working.' : 'Repair recorded; machine remains on breakdown.');
            }
            async function setWorkingSingle(id){
              const r = await db.rpc('set_machine_online', {p_machine_id:id});
              if (r.error) { notify(r.error.message || 'Unable to set machine working', true); return; }
              await loadFleetSingle();
              notify('Machine is working.');
            }
            window.renderDashboard = renderFleetDashboard;
            window.loadFleet = loadFleetSingle;
            window.completeRepair = completeRepairSingle;
            window.setWorking = setWorkingSingle;
            const refresh = document.getElementById('refresh');
            if (refresh) refresh.onclick = loadFleetSingle;
            ['kWorking','kOperational'].forEach(id => { const e=document.getElementById(id); if(e) e.onclick=()=>show('machines'); });
            const bd=document.getElementById('kBreakdowns'); if(bd) bd.onclick=()=>show('breakdowns');
            let busy=false;
            async function tick(){ if(busy || !window.profile) return; busy=true; try{await loadFleetSingle();} finally{busy=false;} }
            setTimeout(tick, 800);
            setInterval(tick, 5000);
            if (window.db && db.channel) {
              db.channel('phatsema-dashboard-single-' + Date.now())
                .on('postgres_changes',{event:'*',schema:'public',table:'machines'},tick)
                .on('postgres_changes',{event:'*',schema:'public',table:'breakdowns'},tick)
                .subscribe();
            }
          })();
          </script>
          </body></html>
          '''
          p.write_text(prefix + '\n' + clean, encoding='utf-8')
          PY

      - name: Commit cleaned dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No dashboard changes needed'
          else
            git commit -m 'fix: remove duplicate dashboard patches'
            git push
          fi