<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1267a8"><meta name="description" content="Phatsema Fleet Operations — live fleet control, breakdowns and service management"><title>Phatsema Fleet Operations</title><link rel="stylesheet" href="./styles.css?v=20260930-4"></head><body><div id="login" class="screen"><form id="loginForm" class="login-card"><div class="brand-lockup"><img class="logo-image" src="https://phatsema.com/wp-content/uploads/2025/04/PHATSEMA-PROJECTS-LOGO.png" alt="Phatsema Projects & Supplies"><div class="brand-word">FLEET OPERATIONS<span>LIVE OPERATIONS CONTROL</span></div></div><h1>Fleet Operations</h1><p>Secure operations control for your fleet.</p><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required><button id="loginBtn" class="primary" type="submit">Log in</button><button class="secondary" type="button" id="forgotBtn">Forgot password</button><div id="loginMsg" class="message"></div></form></div><div id="app" class="hidden"><div id="loadErr" class="message" style="margin:10px 18px"></div><header class="top"><div class="top-brand"><img class="logo-image top-logo" src="https://phatsema.com/wp-content/uploads/2025/04/PHATSEMA-PROJECTS-LOGO.png" alt="Phatsema Projects & Supplies"><div><strong>FLEET OPERATIONS</strong><span class="subbrand">ENGINEERING AFRICA’S FUTURE</span></div><span id="userBadge"></span></div><div class="top-actions"><button id="themeBtn" class="secondary theme-toggle" type="button" aria-label="Toggle light and dark mode">🌙 Dark</button><button id="logoutBtn" class="secondary">Log out</button></div></header><div class="shell"><aside><nav id="nav"></nav></aside><main id="main"></main></div></div><div id="modalRoot"></div><div id="toastRoot"></div><script>
(function(){
  function loadApp(){
    var s=document.createElement("script");
    s.src="./app.js?v=20261001-2";
    s.onerror=function(){
      var m=document.getElementById("loginMsg");
      if(m)m.textContent="Phatsema could not load the application code. Please refresh.";
    };
    document.body.appendChild(s);
  }
  function loadSupabase(){
    var s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
    s.onload=loadApp;
    s.onerror=function(){
      var f=document.createElement("script");
      f.src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js";
      f.onload=loadApp;
      f.onerror=function(){
        var m=document.getElementById("loginMsg");
        if(m)m.textContent="Secure login library could not be loaded. Check your internet connection and refresh.";
      };
      document.body.appendChild(f);
    };
    document.body.appendChild(s);
  }
  loadSupabase();
})();
</script></body></html>
